name: CI

# Every push and pull request: the PHP tests against a real MariaDB (the
# migrations use generated and spatial columns, so SQLite can't run them),
# then the frontend typecheck and build.
on:
  push:
    branches: [ main, audit-fixes ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: popmart_tracker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: popmart_tracker_test
      DB_USERNAME: root
      DB_PASSWORD: password

